apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: postgresql-outputport-template.1
  title: PostgreSQL Output Port
  description: Provide your data via PostgreSQL!
  annotations:
    backstage.io/techdocs-ref: dir:.
  mesh:
    icon: https://upload.wikimedia.org/wikipedia/commons/2/29/Postgresql_elephant.svg
  tags:
    - postgresql
    - output-port
spec:
  generates: componenttype:default/outputport
  owner: datev_eg
  type: outputport
  parameters:
    - title: Component metadata
      description: Basic information for this component.
      required:
        - name
        - domain
        - description
        - dataproduct
      properties:
        name:
          title: Name
          type: string
          description: Required name used for display purposes
          ui:field: EntityNamePicker
          default: PostgreSQL Output Port
        description:
          title: Description
          type: string
          description: Help others understand what this Output Port is for
          default: Output Port to write data to PostgreSQL
        domain:
          title: Domain
          type: string
          ui:field: EntityPicker
          ui:options:
            allowArbitraryValues: false
            allowedKinds:
              - Domain
        dataproduct:
          title: Data Product
          type: string
          ui:field: EntityPicker
          ui:filter:
            - fieldName: domain
              entityPath: spec.domain
          ui:options:
            allowArbitraryValues: false
            allowedKinds:
              - System
        identifier:
          title: Identifier
          type: string
          ui:field: ComponentIdentifierPicker
          ui:options:
            allowArbitraryValues: false
        owner:
          title: Component Owner
          type: string
          ui:field: EntitySelectionPicker
          ui:fieldName: dataproduct
          ui:property: spec.owner
          ui:options:
            allowArbitraryValues: false
        developmentGroup:
          title: Development Group
          type: string
          ui:field: EntitySelectionPicker
          ui:fieldName: dataproduct
          ui:property: spec.owner
          ui:options:
            allowArbitraryValues: false
        domainName:
          type: string
          ui:field: EntitySelectionPicker
          ui:fieldName: domain
          ui:property: spec.mesh.name
          ui:options:
            allowArbitraryValues: false
          ui:widget: hidden
        dataproductName:
          type: string
          ui:field: EntitySelectionPicker
          ui:fieldName: dataproduct
          ui:property: spec.mesh.name
          ui:options:
            allowArbitraryValues: false
          ui:widget: hidden
    - title: PostgreSQL Outputport Configuration
      description: Define the database connection and schema
      properties:
        host:
          title: Host
          type: string
          description: PostgreSQL hostname or IP
        port:
          title: Port
          type: integer
          description: PostgreSQL port (default 5432)
        dbname:
          title: Database Name
          type: string
        user:
          title: User
          type: string
        password:
          title: Password
          type: string
          ui:widget: password
        table:
          title: Table
          type: string
        schema:
          title: Schema
          type: string
          description: Optional, default 'public'
        ontologyname:
          title: Ontology Name
          type: string
          description: Name of the ontology to be created by this components data-schema. If left empty, no ontology will be created. Creation happens at deploy-time of the dataproduct.
          ui:field: EntityNamePicker
          pattern: ^[a-zA-Z0-9-]+$
        metaphactoryBaseUrl:
          title: Metaphactory Base URL
          type: string
          description: Base URL of your Metaphactory instance (z.B. https://metaphactory.datev.de). Wird für den direkten Link zur Ontologie genutzt.
          default: https://metaphactory.datev.de
        ontologyClassUri:
          title: Ontologie-Klassen-URI
          type: string
          description: Vollständige URI der Ontologie-Klasse in Metaphactory (z.B. https://ontology.datev.de/ns#Buchungsposition). Leer lassen wenn keine Verlinkung gewünscht.
  steps:
    - id: template
      name: Fetch Skeleton + Template
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: '${{ parameters.name.split(" ") | join("-") | lower }}'
        values:
          name: '${{ parameters.name }}'
          fullyQualifiedName: '${{ parameters.fullyQualifiedName }}'
          description: '${{ parameters.description }}'
          domain: '${{ parameters.domain }}'
          dataproduct: '${{ parameters.dataproduct }}'
          identifier: '${{ parameters.identifier }}'
          developmentGroup: '${{ parameters.developmentGroup }}'
          infrastructureTemplateId: urn:dmb:itm:postgresql-techadapter:0
          useCaseTemplateId: urn:dmb:utm:postgresql-outputport-template:0.0.0
          useCaseTemplateVersion: 0.0.0
          owner: "${{ parameters.owner }}"
          host: '${{ parameters.host }}'
          port: '${{ parameters.port }}'
          dbname: '${{ parameters.dbname }}'
          user: '${{ parameters.user }}'
          password: '${{ parameters.password }}'
          table: '${{ parameters.table }}'
          schema: '${{ parameters.schema | default("public") }}'
          metaphactoryBaseUrl: '${{ parameters.metaphactoryBaseUrl }}'
          ontologyClassUri: '${{ parameters.ontologyClassUri }}'
          destination: &destination 'github.com?owner=datevscm&repo=dataproduct-${{ parameters.domain | replace(r/domain:| |-/, "") }}-${{ parameters.dataproduct.split(".")[1] | replace(r/ /g, "-") }}'
    - id: publish
      name: Publish
      action: witboostMeshComponent:publish:github
      input:
        allowedHosts: ["github.com"]
        description: 'This is ${{ parameters.name }}'
        repoUrl: *destination
        rootDirectory: '${{ parameters.name.split(" ") | join("-") | lower }}'
        parentRef: '${{ parameters.dataproduct }}'
        dataproduct: '${{ parameters.dataproduct }}'
        repoVisibility: internal

    - id: register
      name: Register
      action: catalog:register
      input:
        catalogInfoUrl: 'https://github.com/datevscm/dataproduct-${{ parameters.domain | replace(r/domain:| |-/, "") }}-${{ parameters.dataproduct.split(".")[1] | replace(r/ /g, "-") }}/blob/master/${{ parameters.name.split(" ") | join("-") | lower }}/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: "${{ steps.publish.output.remoteUrl }}"
      - title: Open in catalog
        icon: catalog
        entityRef: "${{ steps.register.output.entityRef }}"
